<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One Piece Connections</title>
  <link rel="icon" type="image/png" href="logo.png">

  <meta property="og:title" content="One Piece Connections">
  <meta property="og:description" content="Encuentra 4 grupos conectados por distintos atributos.">
  <meta property="og:image" content="https://niko8j.github.io/OPConnection/previsualizacion.png">
  <meta property="og:url" content="https://niko8j.github.io/OPConnection/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="One Piece Connections">
  <meta name="twitter:description" content="Encuentra 4 grupos conectados por distintos atributos.">
  <meta name="twitter:image" content="https://niko8j.github.io/OPConnection/previsualizacion.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    html { height: 100%; }
    body {
      background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center;
      min-height: 100vh; min-height: 100dvh; padding: 12px;
    }
    .container { max-width: 650px; width: 100%; text-align: center; position: relative; }
    h1 { margin-bottom: 4px; color: #f59e0b; font-size: 2rem; text-transform: uppercase; letter-spacing: 1px; }
    p { margin-bottom: 10px; color: #94a3b8; }

    .difficulty-selector { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }

    .auth-bar { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .auth-guest, .auth-user { display: flex; align-items: center; gap: 8px; }
    .auth-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; object-position: top center; border: 2px solid #f59e0b; }
    #auth-user-name { font-weight: bold; color: #f8fafc; }

    .auth-modal-content { max-width: 380px; text-align: left; }
    .auth-input {
      width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 6px;
      border: 1px solid #334155; background: #1e293b; color: #f8fafc; font-size: 0.95rem;
    }
    .auth-error { color: #ef4444; font-size: 0.85rem; margin-bottom: 8px; min-height: 1em; }
    .auth-avatar-label { margin: 6px 0; color: #94a3b8; font-size: 0.9rem; }
    .avatar-picker {
      display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px;
      max-height: 220px; overflow-y: auto; margin-bottom: 12px; padding: 6px;
      background: #0f172a; border-radius: 6px;
    }
    .avatar-option {
      width: 100%; aspect-ratio: 1; object-fit: cover; object-position: top center;
      border-radius: 6px; cursor: pointer; border: 2px solid transparent; opacity: 0.7;
    }
    .avatar-option:hover { opacity: 1; }
    .avatar-option.selected { border-color: #f59e0b; opacity: 1; }
    .auth-switch { text-align: center; margin-top: 10px; font-size: 0.9rem; color: #94a3b8; }
    .auth-switch a { color: #f59e0b; cursor: pointer; text-decoration: underline; }
    .diff-label { color: #94a3b8; font-weight: bold; margin-right: 2px; }
    .diff-btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: 2px solid #334155;
      background: #1e293b;
      color: #94a3b8;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    @media (hover: hover) and (pointer: fine) {
      .diff-btn:hover:not(:disabled) { border-color: #f59e0b; color: #f8fafc; }
    }
    .diff-btn.active { background: #f59e0b; color: #0f172a; border-color: #f59e0b; }

    .infinite-score { font-size: 1rem; font-weight: bold; color: #f59e0b; margin-bottom: 8px; }

    .lives-container { font-size: 1.1rem; font-weight: bold; margin-bottom: 8px; color: #e2e8f0; display: flex; justify-content: center; align-items: center; gap: 12px; }
    .life-wrapper { position: relative; display: inline-flex; justify-content: center; align-items: center; }
    .life-icon { font-size: 1.5rem; user-select: none; }
    .life-wrapper.lost .life-icon { filter: opacity(0.3); }
    .life-wrapper.lost::after {
      content: "❌";
      position: absolute;
      font-size: 1.2rem;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .warning-msg { color: #ef4444; font-size: 0.9rem; font-weight: bold; min-height: 18px; margin-bottom: 6px; }

    .board { display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
    .solved-category { padding: 15px; border-radius: 8px; font-weight: bold; color: #0f172a; text-align: center; animation: fadeIn 0.3s ease; }
    .solved-items-list { display: flex; justify-content: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
    .solved-img { 
      width: 50px; 
      height: 50px; 
      object-fit: contain; 
      border-radius: 6px; 
      border: 2px solid #0f172a; 
      background-color: #1e293b;
    }
    
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    
    .card {
      background-color: #1e293b;
      border: 3px solid #334155;
      border-radius: 8px;
      height: 120px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
      overflow: hidden;
      padding: 4px;
    }
    .card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
    }
    @media (hover: hover) and (pointer: fine) {
      .card:hover { border-color: #f59e0b; }
    }
    .card.selected { border-color: #f59e0b; box-shadow: 0 0 10px #f59e0b; transform: scale(0.96); }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
      width: 100%;
      flex-wrap: wrap;
    }
    .controls-left {
      display: flex;
      gap: 10px;
    }
    #view-results-btn {
      margin-left: auto;
    }

    button.action-btn {
      padding: 10px 20px;
      border-radius: 20px;
      border: 2px solid #334155;
      background: #1e293b;
      color: #f8fafc;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    @media (hover: hover) and (pointer: fine) {
      button.action-btn:hover:not(:disabled) { background: #334155; }
      button.submit:hover:not(:disabled) { background: #d97706; border-color: #d97706; }
    }
    button.submit { background: #f59e0b; color: #0f172a; border-color: #f59e0b; }
    button:disabled { opacity: 0.3; cursor: not-allowed; }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%; height: 100dvh;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: flex-start;
      padding: 30px 15px;
      overflow-y: auto;
      z-index: 100;
    }
    .modal-content {
      background: #1e293b;
      border: 2px solid #ef4444;
      border-radius: 12px;
      padding: 25px;
      max-width: 520px;
      width: 100%;
      margin: auto;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      animation: fadeIn 0.3s ease;
      position: relative;
      max-height: 85vh;
      max-height: 85dvh;
      overflow-y: auto;
    }
    .modal-content h2 { margin-bottom: 10px; font-size: 1.6rem; }
    .solutions-list { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; margin-bottom: 20px; text-align: left; }

    .close-btn {
      position: absolute;
      top: 12px; right: 15px;
      background: none; border: none;
      color: #94a3b8; font-size: 1.5rem;
      font-weight: bold; cursor: pointer;
    }
    @media (hover: hover) and (pointer: fine) {
      .close-btn:hover { color: #f8fafc; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      body { padding: 8px; }
      h1 { font-size: 1.4rem; margin-bottom: 2px; }
      p { font-size: 0.85rem; margin-bottom: 8px; }
      .difficulty-selector { gap: 6px; margin-bottom: 10px; }
      .avatar-picker { grid-template-columns: repeat(4, 1fr); max-height: 180px; }
      .auth-bar { gap: 6px; }
      .diff-label { width: 100%; margin-bottom: 2px; }
      .diff-btn { padding: 6px 10px; font-size: 0.85rem; }
      .lives-container { margin-bottom: 6px; font-size: 1rem; gap: 8px; }
      .warning-msg { min-height: 14px; margin-bottom: 4px; font-size: 0.8rem; }
      .board { gap: 6px; margin-bottom: 8px; }
      .grid { gap: 6px; }
      .card { height: 80px; padding: 0; border-width: 2px; }
      .card img {
        object-fit: cover;
        object-position: top center;
        transform: scale(1.15);
        transform-origin: top center;
      }
      .controls { margin-top: 6px; gap: 8px; }
      button.action-btn { padding: 8px 14px; font-size: 0.9rem; }

      .modal-overlay { padding: 12px 8px; }
      .modal-content { padding: 16px; max-height: 92vh; max-height: 92dvh; }
      .modal-content h2 { font-size: 1.25rem; margin-bottom: 6px; }
      .modal-content p { font-size: 0.85rem; margin-bottom: 4px; }
      .solutions-list { gap: 8px; margin-top: 10px; margin-bottom: 14px; }
      .solved-img { width: 40px; height: 40px; }
      .close-btn { top: 8px; right: 10px; font-size: 1.3rem; }
    }
  </style>
  <!-- Firebase SDK (Auth + Firestore) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>
<body>

<div class="container">
  <h1>One Piece Connections</h1>
  <p>Encuentra 4 grupos conectados por distintos atributos.</p>

  <div id="auth-bar" class="auth-bar">
    <div id="auth-guest" class="auth-guest">
      <button class="action-btn" onclick="openAuthModal('login')">Iniciar sesión</button>
      <button class="action-btn" onclick="openAuthModal('register')">Registrarse</button>
    </div>
    <div id="auth-user" class="auth-user" style="display: none;">
      <img id="auth-user-avatar" class="auth-avatar" src="" alt="Avatar">
      <span id="auth-user-name"></span>
      <button class="action-btn" onclick="doLogout()">Cerrar sesión</button>
    </div>
  </div>

  <div class="difficulty-selector">
    <span class="diff-label">Dificultades:</span>
    <button class="diff-btn active" onclick="setDifficulty('facil', event)">Novato</button>
    <button class="diff-btn" onclick="setDifficulty('media', event)">Supernova</button>
    <button class="diff-btn" onclick="setDifficulty('dificil', event)">Yonko</button>
    <button class="diff-btn" onclick="setDifficulty('infinito', event)">Infinito</button>
  </div>

  <div id="infinite-score" class="infinite-score" style="display: none;"></div>

  <div class="lives-container">
    Vidas: <span id="lives-icons"></span>
  </div>

  <div id="warning-msg" class="warning-msg"></div>

  <div class="board">
    <div id="solved-container"></div>
    <div id="grid" class="grid"></div>
  </div>

  <div class="controls">
    <div class="controls-left">
      <button class="action-btn submit" id="submit-btn" onclick="checkGuess()">Enviar</button>
      <button class="action-btn" id="deselect-btn" onclick="deselectAll()">Limpiar</button>
    </div>
    <button class="action-btn" id="view-results-btn" onclick="openModal()" style="display: none;">📊 Resultados</button>
  </div>
</div>

<div id="gameover-modal" class="modal-overlay" onclick="closeModalOnOverlay(event)">
  <div class="modal-content">
    <button class="close-btn" onclick="closeModalViaX()">&times;</button>
    <h2 id="modal-title"></h2>
    <p id="modal-text"></p>
    <div id="solutions-container" class="solutions-list"></div>
    <button class="action-btn" id="modal-action-btn" onclick="closeModal()">Entendido</button>
  </div>
</div>

<div id="auth-modal" class="modal-overlay" onclick="closeAuthModalOnOverlay(event)">
  <div class="modal-content auth-modal-content">
    <button class="close-btn" onclick="closeAuthModal()">&times;</button>
    <h2 id="auth-modal-title">Iniciar sesión</h2>

    <div id="auth-error" class="auth-error"></div>

    <input type="email" id="auth-email" class="auth-input" placeholder="Correo electrónico" autocomplete="email">
    <input type="password" id="auth-password" class="auth-input" placeholder="Contraseña" autocomplete="current-password">

    <div id="auth-register-extra" style="display:none;">
      <input type="password" id="auth-password-confirm" class="auth-input" placeholder="Confirma tu contraseña" autocomplete="new-password">
      <input type="text" id="auth-username" class="auth-input" placeholder="Nombre de usuario">
      <p class="auth-avatar-label">Elige tu foto de perfil:</p>
      <div id="avatar-picker" class="avatar-picker"></div>
    </div>

    <button class="action-btn submit" id="auth-submit-btn" onclick="submitAuthForm()">Entrar</button>
    <p class="auth-switch">
      <span id="auth-switch-text">¿No tienes cuenta?</span>
      <a href="#" id="auth-switch-link" onclick="toggleAuthMode(event)">Regístrate</a>
    </p>
  </div>
</div>

<script>
  // ---------- Firebase ----------
  // Sustituye estos valores por los de tu proyecto (Configuración del proyecto > General > Tus apps).
  const firebaseConfig = {
    apiKey: "AIzaSyCuksk-Eeon3Si4f8SJgevvYo-D41fycm8",
    authDomain: "op-connections.firebaseapp.com",
    projectId: "op-connections",
    storageBucket: "op-connections.firebasestorage.app",
    messagingSenderId: "749076812222",
    appId: "1:749076812222:web:2886ea2491fab3ded729ef"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  let currentUser = null;
  let currentUserProfile = null; // { username, avatar, email }
  let authMode = "login"; // "login" | "register"
  let selectedAvatarImg = null;

  const MAX_LIVES = 4;
  const COLORS = ["#fef08a", "#bbf7d0", "#bfdbfe", "#e9d5ff"];
  const STORAGE_KEY_STATE = "opConnectionsInfiniteState";

  let database = [];
  let currentDifficulty = "facil";
  let currentCategories = [];
  let cards = [];
  let selectedCards = [];
  let lives = MAX_LIVES;
  let gameOver = false;

  let isInfiniteMode = false;
  let infiniteSolvedCount = 0;
  let solvedOrder = [];
  let awaitingNextPanel = false;

  // ---------- Progreso de Infinito: nube (usuario logueado) o localStorage (invitado) ----------

  function buildInfiniteStateSnapshot() {
    return {
      currentCategories,
      cards,
      selectedCards,
      lives,
      solvedCount: infiniteSolvedCount,
      solvedOrder,
      solvedContainerHTML: document.getElementById("solved-container").innerHTML
    };
  }

  function saveInfiniteStateLocal(state) {
    try {
      localStorage.setItem(STORAGE_KEY_STATE, JSON.stringify(state));
    } catch (e) {
      // localStorage no disponible (navegación privada, cuota llena, etc.): fallamos en silencio.
    }
  }

  function loadInfiniteStateLocal() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY_STATE);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  function clearInfiniteStateLocal() {
    try {
      localStorage.removeItem(STORAGE_KEY_STATE);
    } catch (e) {
      // sin acceso a localStorage: no hay nada que limpiar
    }
  }

  async function saveInfiniteStateCloud(state) {
    if (!currentUser) return;
    try {
      await db.collection("users").doc(currentUser.uid).set({ infiniteState: state }, { merge: true });
    } catch (e) {
      console.error("No se pudo guardar el progreso en la nube:", e);
    }
  }

  async function loadInfiniteStateCloud() {
    if (!currentUser) return null;
    try {
      const snap = await db.collection("users").doc(currentUser.uid).get();
      return snap.exists && snap.data().infiniteState ? snap.data().infiniteState : null;
    } catch (e) {
      console.error("No se pudo cargar el progreso de la nube:", e);
      return null;
    }
  }

  async function clearInfiniteStateCloud() {
    if (!currentUser) return;
    try {
      await db.collection("users").doc(currentUser.uid).set(
        { infiniteState: firebase.firestore.FieldValue.delete() }, { merge: true }
      );
    } catch (e) {
      console.error("No se pudo limpiar el progreso de la nube:", e);
    }
  }

  // Guarda el progreso del modo Infinito: en Firestore si hay sesión iniciada, si no en localStorage.
  function saveInfiniteState() {
    if (!isInfiniteMode || gameOver) return;
    const state = buildInfiniteStateSnapshot();
    if (currentUser) {
      saveInfiniteStateCloud(state); // no bloqueamos la partida esperando la escritura
    } else {
      saveInfiniteStateLocal(state);
    }
  }

  async function loadInfiniteState() {
    return currentUser ? await loadInfiniteStateCloud() : loadInfiniteStateLocal();
  }

  function clearInfiniteStorage() {
    if (currentUser) {
      clearInfiniteStateCloud();
    } else {
      clearInfiniteStateLocal();
    }
  }

  // Restaura una partida Infinito guardada (usado tanto al recargar la página como al volver a pulsar "Infinito").
  function resumeInfiniteFromSaved(saved) {
    currentCategories = saved.currentCategories;
    cards = saved.cards;
    selectedCards = saved.selectedCards;
    lives = saved.lives;
    infiniteSolvedCount = saved.solvedCount;
    solvedOrder = saved.solvedOrder || [];
    gameOver = false;
    awaitingNextPanel = false;

    document.getElementById("solved-container").innerHTML = saved.solvedContainerHTML;
    document.getElementById("warning-msg").innerText = "";
    document.getElementById("submit-btn").disabled = false;
    document.getElementById("deselect-btn").disabled = false;
    document.getElementById("view-results-btn").style.display = "none";
    document.getElementById("gameover-modal").style.display = "none";

    updateInfiniteScoreDisplay();

    if (!cards || cards.length === 0) {
      // El progreso se guardó justo al completar un panel: empezamos el siguiente.
      generateNewBoard();
    } else {
      renderLives();
      renderGrid();
    }
  }

  // ---------- Autenticación (registro / login / logout) ----------

  function updateAuthUI() {
    const guestEl = document.getElementById("auth-guest");
    const userEl = document.getElementById("auth-user");

    if (currentUser) {
      guestEl.style.display = "none";
      userEl.style.display = "flex";
      const avatarSrc = (currentUserProfile && currentUserProfile.avatar) || "https://dummyimage.com/100x100/334155/ffffff.png&text=?";
      document.getElementById("auth-user-avatar").src = avatarSrc;
      document.getElementById("auth-user-name").innerText = (currentUserProfile && currentUserProfile.username) || currentUser.email;
    } else {
      guestEl.style.display = "flex";
      userEl.style.display = "none";
    }
  }

  function openAuthModal(mode) {
    authMode = mode;
    document.getElementById("auth-error").innerText = "";
    document.getElementById("auth-email").value = "";
    document.getElementById("auth-password").value = "";
    document.getElementById("auth-password-confirm").value = "";
    document.getElementById("auth-username").value = "";
    selectedAvatarImg = null;
    applyAuthModeUI();
    if (mode === "register") buildAvatarPicker();
    document.getElementById("auth-modal").style.display = "flex";
  }

  function applyAuthModeUI() {
    const isRegister = authMode === "register";
    document.getElementById("auth-modal-title").innerText = isRegister ? "Crear cuenta" : "Iniciar sesión";
    document.getElementById("auth-register-extra").style.display = isRegister ? "block" : "none";
    document.getElementById("auth-submit-btn").innerText = isRegister ? "Registrarme" : "Entrar";
    document.getElementById("auth-switch-text").innerText = isRegister ? "¿Ya tienes cuenta?" : "¿No tienes cuenta?";
    document.getElementById("auth-switch-link").innerText = isRegister ? "Inicia sesión" : "Regístrate";
  }

  function toggleAuthMode(event) {
    event.preventDefault();
    authMode = authMode === "login" ? "register" : "login";
    document.getElementById("auth-error").innerText = "";
    applyAuthModeUI();
    if (authMode === "register") buildAvatarPicker();
  }

  function closeAuthModal() {
    document.getElementById("auth-modal").style.display = "none";
  }

  function closeAuthModalOnOverlay(event) {
    if (event.target.id === "auth-modal") closeAuthModal();
  }

  function buildAvatarPicker() {
    const picker = document.getElementById("avatar-picker");
    picker.innerHTML = "";

    database.forEach(char => {
      const img = document.createElement("img");
      img.src = char.img;
      img.alt = char.name;
      img.title = char.name;
      img.className = "avatar-option";
      img.onerror = function () { this.src = "https://dummyimage.com/100x100/334155/ffffff.png&text=?"; };
      img.onclick = () => {
        document.querySelectorAll(".avatar-option.selected").forEach(el => el.classList.remove("selected"));
        img.classList.add("selected");
        selectedAvatarImg = char.img;
      };
      picker.appendChild(img);
    });
  }

  async function submitAuthForm() {
    const errorEl = document.getElementById("auth-error");
    errorEl.innerText = "";

    const email = document.getElementById("auth-email").value.trim();
    const password = document.getElementById("auth-password").value;

    if (!email || !password) {
      errorEl.innerText = "Rellena correo y contraseña.";
      return;
    }

    if (authMode === "login") {
      try {
        await auth.signInWithEmailAndPassword(email, password);
        closeAuthModal();
      } catch (e) {
        errorEl.innerText = traduceErrorFirebase(e);
      }
      return;
    }

    // Registro
    const passwordConfirm = document.getElementById("auth-password-confirm").value;
    const username = document.getElementById("auth-username").value.trim();

    if (password.length < 6) {
      errorEl.innerText = "La contraseña debe tener al menos 6 caracteres.";
      return;
    }
    if (password !== passwordConfirm) {
      errorEl.innerText = "Las contraseñas no coinciden.";
      return;
    }
    if (!username) {
      errorEl.innerText = "Elige un nombre de usuario.";
      return;
    }
    if (!selectedAvatarImg) {
      errorEl.innerText = "Elige una foto de perfil.";
      return;
    }

    try {
      const cred = await auth.createUserWithEmailAndPassword(email, password);
      await db.collection("users").doc(cred.user.uid).set({ username, avatar: selectedAvatarImg, email });
      currentUserProfile = { username, avatar: selectedAvatarImg, email };
      updateAuthUI();
      closeAuthModal();
    } catch (e) {
      errorEl.innerText = traduceErrorFirebase(e);
    }
  }

  function doLogout() {
    auth.signOut();
  }

  function traduceErrorFirebase(e) {
    const map = {
      "auth/email-already-in-use": "Ese correo ya está registrado.",
      "auth/invalid-email": "El correo no es válido.",
      "auth/weak-password": "La contraseña es demasiado débil (mínimo 6 caracteres).",
      "auth/user-not-found": "No existe ninguna cuenta con ese correo.",
      "auth/wrong-password": "Contraseña incorrecta.",
      "auth/invalid-credential": "Correo o contraseña incorrectos.",
      "auth/too-many-requests": "Demasiados intentos. Prueba de nuevo en unos minutos."
    };
    return (e && map[e.code]) || "Ha ocurrido un error. Inténtalo de nuevo.";
  }

  // Se resuelve la primera vez que Firebase confirma si había sesión guardada en el navegador.
  let resolveAuthReady;
  const authReadyPromise = new Promise(resolve => { resolveAuthReady = resolve; });
  let authListenerFired = false;

  auth.onAuthStateChanged(async user => {
    const isFirstCall = !authListenerFired;
    authListenerFired = true;
    currentUser = user;

    if (user) {
      try {
        const snap = await db.collection("users").doc(user.uid).get();
        currentUserProfile = snap.exists ? snap.data() : null;
      } catch (e) {
        currentUserProfile = null;
      }
    } else {
      currentUserProfile = null;
    }

    updateAuthUI();

    if (isFirstCall) {
      resolveAuthReady();
      return;
    }

    // Si el usuario inicia sesión durante la partida, recuperamos su progreso Infinito guardado en la nube.
    if (user && isInfiniteMode) {
      const saved = await loadInfiniteStateCloud();
      if (saved) resumeInfiniteFromSaved(saved);
    }
  });

  window.addEventListener("DOMContentLoaded", () => {
    fetch("personajes.json")
      .then(res => {
        if (!res.ok) throw new Error(`No se pudo cargar Personajes.json (${res.status})`);
        return res.json();
      })
      .then(async data => {
        database = data;

        await authReadyPromise; // esperamos a saber si hay sesión iniciada antes de decidir qué restaurar
        const saved = await loadInfiniteState();

        if (saved) {
          currentDifficulty = "infinito";
          isInfiniteMode = true;
          document.querySelectorAll('.diff-btn').forEach(btn => btn.classList.remove('active'));
          const infinitoBtn = document.querySelector('.diff-btn[onclick*="infinito"]');
          if (infinitoBtn) infinitoBtn.classList.add('active');
          resumeInfiniteFromSaved(saved);
        } else {
          generateNewBoard();
        }
      })
      .catch(err => {
        document.getElementById("warning-msg").innerText = "⚠️ " + err.message;
      });
  });

  async function setDifficulty(level, event) {
    if (isInfiniteMode && level !== "infinito") {
      // Si dejamos un panel ya resuelto sin pulsar "Siguiente", lo avanzamos en silencio
      // para no dejar un panel a medio cerrar guardado.
      if (awaitingNextPanel) {
        closeModal();
        awaitingNextPanel = false;
        generateNewBoard();
      }

      // Si dejamos una partida Infinito a medias (sin haber fallado), guardamos su progreso.
      if (!gameOver) {
        saveInfiniteState();
      }
    }

    currentDifficulty = level;
    isInfiniteMode = (level === "infinito");
    document.querySelectorAll('.diff-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');

    if (isInfiniteMode) {
      const saved = await loadInfiniteState();
      if (saved) {
        resumeInfiniteFromSaved(saved);
        return;
      }
      infiniteSolvedCount = 0;
    }

    updateInfiniteScoreDisplay();
    generateNewBoard();
  }

  function updateInfiniteScoreDisplay() {
    const el = document.getElementById("infinite-score");
    if (isInfiniteMode) {
      el.style.display = "block";
      el.innerText = `🏆 Paneles resueltos: ${infiniteSolvedCount}`;
    } else {
      el.style.display = "none";
    }
  }

  function parseTagEntries(tagData) {
    if (tagData === null || tagData === undefined) return [];

    const items = Array.isArray(tagData) ? tagData : [tagData];

    return items.map(item => {
      let value = item;
      let difficulty = "facil";

      if (item !== null && typeof item === "object" && !Array.isArray(item)) {
        if ("dif" in item) difficulty = item.dif;

        if ("val" in item) value = item.val;
        else if ("value" in item) value = item.value;
        else if ("nombre" in item) value = item.nombre;
        else if ("name" in item) value = item.name;
        else {
          const stringVals = Object.values(item).filter(x => typeof x === "string" || typeof x === "number");
          value = stringVals.length > 0 ? stringVals[0] : Object.values(item)[0];
        }
      }

      return { value: String(value), difficulty };
    });
  }

  function getTagValueOnly(categoryName) {
    return categoryName.includes(": ") ? categoryName.split(": ").slice(1).join(": ") : categoryName;
  }

  function generateNewBoard() {
    if (database.length === 0) return;

    let tagGroups = {}; 

    database.forEach(char => {
      if (char.tags) {
        Object.entries(char.tags).forEach(([key, tagData]) => {
          const entries = parseTagEntries(tagData);

          entries.forEach(({ value, difficulty: tagDif }) => {
            if (isInfiniteMode || tagDif === currentDifficulty) {
              const groupName = `${key}: ${value}`;
              if (!tagGroups[groupName]) tagGroups[groupName] = [];
              if (!tagGroups[groupName].some(c => c.id === char.id)) {
                tagGroups[groupName].push(char);
              }
            }
          });
        });
      }
    });

    let validGroupNames = Object.keys(tagGroups).filter(group => tagGroups[group].length >= 4);

    if (validGroupNames.length < 4) {
      document.getElementById("warning-msg").innerText = 
        `⚠️ Faltan datos en '${currentDifficulty.toUpperCase()}': Se necesitan al menos 4 categorías válidas. Hay ${validGroupNames.length}.`;
      return;
    }

    const charHasAnyTagMatch = (char, targetGroupName) => {
      const sepIndex = targetGroupName.indexOf(": ");
      const targetKey = targetGroupName.slice(0, sepIndex);
      const targetVal = targetGroupName.slice(sepIndex + 2);
      if (!char.tags) return false;

      return Object.entries(char.tags).some(([key, tagData]) => {
        if (key !== targetKey) return false;
        const entries = parseTagEntries(tagData);
        return entries.some(e => e.value === targetVal);
      });
    };

    let selectedGroups = null;
    let maxAttempts = 1000;

    for (let attempt = 0; attempt < maxAttempts; attempt++) {
      let shuffledGroups = [...validGroupNames].sort(() => Math.random() - 0.5);
      let candidateGroups = [];
      let usedCharIds = new Set();

      for (let groupName of shuffledGroups) {
        if (candidateGroups.length === 4) break;

        let exclusiveChars = tagGroups[groupName].filter(char => {
          if (usedCharIds.has(char.id)) return false;

          for (let prevGroup of candidateGroups) {
            if (charHasAnyTagMatch(char, prevGroup.name)) return false;
          }
          return true;
        });

        if (exclusiveChars.length >= 4) {
          let chosenChars = exclusiveChars.sort(() => Math.random() - 0.5).slice(0, 4);

          let invalidatesPrevious = false;
          for (let prevGroup of candidateGroups) {
            for (let prevChar of prevGroup.items) {
              if (charHasAnyTagMatch(prevChar, groupName)) {
                invalidatesPrevious = true;
                break;
              }
            }
            if (invalidatesPrevious) break;
          }

          if (!invalidatesPrevious) {
            candidateGroups.push({
              name: groupName,
              color: COLORS[candidateGroups.length],
              items: chosenChars
            });
            chosenChars.forEach(c => usedCharIds.add(c.id));
          }
        }
      }

      if (candidateGroups.length === 4) {
        selectedGroups = candidateGroups;
        break;
      }
    }

    if (!selectedGroups) {
      document.getElementById("warning-msg").innerText = 
        `⚠️ No se encontraron 4 categorías sin solapamiento en '${currentDifficulty.toUpperCase()}'. Añade más personajes al JSON o diversifica sus tags.`;
      return;
    }

    currentCategories = selectedGroups;
    initGame();
  }

  function initGame() {
    lives = MAX_LIVES;
    gameOver = false;
    awaitingNextPanel = false;
    cards = [];
    selectedCards = [];
    solvedOrder = [];

    document.getElementById("solved-container").innerHTML = "";
    document.getElementById("warning-msg").innerText = "";
    document.getElementById("submit-btn").disabled = false;
    document.getElementById("deselect-btn").disabled = false;
    document.getElementById("view-results-btn").style.display = "none";
    document.getElementById("gameover-modal").style.display = "none";

    currentCategories.forEach(cat => {
      cat.items.forEach(item => {
        cards.push({ name: item.name, img: item.img, category: cat.name });
      });
    });

    cards = cards.sort(() => Math.random() - 0.5);
    renderLives();
    renderGrid();
    saveInfiniteState();
  }

  function renderLives() {
    const livesIcons = document.getElementById("lives-icons");
    livesIcons.innerHTML = "";

    for (let i = 0; i < MAX_LIVES; i++) {
      const wrapper = document.createElement("div");
      wrapper.className = `life-wrapper ${i >= lives ? 'lost' : ''}`;
      
      const span = document.createElement("span");
      span.className = "life-icon";
      span.innerText = "🏴‍☠️";

      wrapper.appendChild(span);
      livesIcons.appendChild(wrapper);
    }
  }

  function renderGrid() {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    cards.forEach((card, index) => {
      const cardEl = document.createElement("div");
      cardEl.className = `card ${selectedCards.includes(index) ? 'selected' : ''}`;
      
      const imgEl = document.createElement("img");
      imgEl.src = card.img;
      imgEl.alt = card.name;
      
      imgEl.onerror = function() {
        this.onerror = null;
        this.src = "https://dummyimage.com/200x200/334155/ffffff.png&text=" + encodeURIComponent(card.name);
      };

      cardEl.appendChild(imgEl);
      cardEl.onclick = () => toggleSelect(index);
      grid.appendChild(cardEl);
    });
  }

  function toggleSelect(index) {
    if (gameOver) return;
    if (selectedCards.includes(index)) {
      selectedCards = selectedCards.filter(i => i !== index);
    } else {
      selectedCards.push(index);
    }
    
    if (selectedCards.length === 4) {
      document.getElementById("warning-msg").innerText = "";
    }
    
    renderGrid();
  }

  function deselectAll() {
    if (gameOver) return;
    selectedCards = [];
    document.getElementById("warning-msg").innerText = "";
    renderGrid();
  }

  function checkGuess() {
    if (gameOver) return;
    const warningMsg = document.getElementById("warning-msg");

    if (selectedCards.length !== 4) {
      warningMsg.innerText = selectedCards.length < 4 ? "Selecciona 4 imágenes para validar." : "Solo puedes validar 4 imágenes a la vez.";
      return;
    }

    warningMsg.innerText = "";

    const selectedCategory = cards[selectedCards[0]].category;
    const isCorrect = selectedCards.every(i => cards[i].category === selectedCategory);

    if (isCorrect) {
      const catData = currentCategories.find(c => c.name === selectedCategory);
      
      const solvedContainer = document.getElementById("solved-container");
      const solvedEl = document.createElement("div");
      solvedEl.className = "solved-category";
      solvedEl.style.backgroundColor = catData.color;
      
      let imgsHtml = '<div class="solved-items-list">';
      catData.items.forEach(item => {
        imgsHtml += `<img src="${item.img}" title="${item.name}" class="solved-img" onerror="this.src='https://dummyimage.com/100x100/334155/ffffff.png&text=?'"/>`;
      });
      imgsHtml += '</div>';

      solvedEl.innerHTML = `${imgsHtml}<div>${getTagValueOnly(catData.name)}</div>`;
      solvedContainer.appendChild(solvedEl);
      solvedOrder.push(selectedCategory);

      cards = cards.filter((_, i) => !selectedCards.includes(i));
      selectedCards = [];
      renderGrid();
      saveInfiniteState();

      if (cards.length === 0) {
        if (isInfiniteMode) {
          handlePanelComplete();
        } else {
          handleWin();
        }
      }
    } else {
      lives--;
      renderLives();

      const categoryCounts = {};
      selectedCards.forEach(i => {
        const cat = cards[i].category;
        categoryCounts[cat] = (categoryCounts[cat] || 0) + 1;
      });
      const maxMatches = Math.max(...Object.values(categoryCounts));

      if (lives === 0) {
        handleGameOver();
      } else {
        if (maxMatches === 3) {
          warningMsg.innerText = "Grupo incorrecto: 3 coincidencias.";
        } else if (maxMatches === 2) {
          warningMsg.innerText = "Grupo incorrecto: 2 coincidencias.";
        } else {
          warningMsg.innerText = "Grupo incorrecto. Inténtalo de nuevo.";
        }
        saveInfiniteState();
      }
    }
  }

  function handlePanelComplete() {
    infiniteSolvedCount++;
    updateInfiniteScoreDisplay();
    awaitingNextPanel = true;
    saveInfiniteState();

    document.getElementById("submit-btn").disabled = true;
    document.getElementById("deselect-btn").disabled = true;
    document.getElementById("view-results-btn").style.display = "inline-block";

    const modalContent = document.querySelector("#gameover-modal .modal-content");
    modalContent.style.borderColor = "#22c55e";

    const titleEl = document.getElementById("modal-title");
    titleEl.innerText = "🎉 ¡Panel superado!";
    titleEl.style.color = "#22c55e";

    const textEl = document.getElementById("modal-text");
    textEl.innerText = `Paneles resueltos en este Infinito: ${infiniteSolvedCount}.`;

    const actionBtn = document.getElementById("modal-action-btn");
    actionBtn.innerText = "Siguiente ➡️";
    actionBtn.onclick = continueInfinitePanel;

    renderModalSolutions();
  }

  function continueInfinitePanel() {
    awaitingNextPanel = false;
    document.getElementById("gameover-modal").style.display = "none";
    generateNewBoard();
  }

  function handleWin() {
    gameOver = true;
    awaitingNextPanel = false;
    document.getElementById("submit-btn").disabled = true;
    document.getElementById("deselect-btn").disabled = true;
    document.getElementById("view-results-btn").style.display = "inline-block";

    const modalContent = document.querySelector("#gameover-modal .modal-content");
    modalContent.style.borderColor = "#22c55e";

    const titleEl = document.getElementById("modal-title");
    titleEl.innerText = "🏆 ¡VICTORIA!";
    titleEl.style.color = "#22c55e";

    const textEl = document.getElementById("modal-text");
    textEl.innerText = "¡Has descubierto todas las conexiones correctamente!";

    const actionBtn = document.getElementById("modal-action-btn");
    actionBtn.innerText = "Entendido";
    actionBtn.onclick = closeModal;

    renderModalSolutions();
  }

  function handleGameOver() {
    gameOver = true;
    awaitingNextPanel = false;
    document.getElementById("submit-btn").disabled = true;
    document.getElementById("deselect-btn").disabled = true;
    document.getElementById("view-results-btn").style.display = "inline-block";

    const modalContent = document.querySelector("#gameover-modal .modal-content");
    modalContent.style.borderColor = "#ef4444";

    const titleEl = document.getElementById("modal-title");
    titleEl.innerText = "🏴‍☠️ ¡DERROTADO!";
    titleEl.style.color = "#ef4444";

    const textEl = document.getElementById("modal-text");
    if (isInfiniteMode) {
      clearInfiniteStorage(); // La partida Infinito termina: la próxima vez se empieza de cero.
      textEl.innerText = `Has agotado tus vidas tras resolver ${infiniteSolvedCount} panel(es) en modo Infinito. Solución de este panel:`;
    } else {
      textEl.innerText = "Has agotado todas tus vidas. Solución de esta partida:";
    }

    const actionBtn = document.getElementById("modal-action-btn");
    actionBtn.innerText = "Entendido";
    actionBtn.onclick = closeModal;

    renderModalSolutions();
  }

  function renderModalSolutions() {
    const solutionsContainer = document.getElementById("solutions-container");
    solutionsContainer.innerHTML = "";

    // Mostramos primero las categorías en el orden en que se acertaron;
    // si quedó alguna sin acertar (derrota), se añade al final.
    const orderedCats = solvedOrder
      .map(name => currentCategories.find(c => c.name === name))
      .filter(Boolean);
    currentCategories.forEach(cat => {
      if (!orderedCats.includes(cat)) orderedCats.push(cat);
    });

    orderedCats.forEach(cat => {
      const solEl = document.createElement("div");
      solEl.className = "solved-category";
      solEl.style.backgroundColor = cat.color;
      
      let imgsHtml = '<div class="solved-items-list">';
      cat.items.forEach(item => {
        imgsHtml += `<img src="${item.img}" title="${item.name}" class="solved-img" onerror="this.src='https://dummyimage.com/100x100/334155/ffffff.png&text=?'"/>`;
      });
      imgsHtml += '</div>';

      solEl.innerHTML = `${imgsHtml}<div>${getTagValueOnly(cat.name)}</div>`;
      solutionsContainer.appendChild(solEl);
    });

    openModal();
  }

  function openModal() {
    if (gameOver || awaitingNextPanel) {
      document.getElementById("gameover-modal").style.display = "flex";
    }
  }

  function closeModal() {
    document.getElementById("gameover-modal").style.display = "none";

    // En Infinito, tras una derrota, al cerrar el aviso empezamos una nueva partida automáticamente.
    if (isInfiniteMode && gameOver) {
      infiniteSolvedCount = 0;
      clearInfiniteStorage();
      gameOver = false;
      updateInfiniteScoreDisplay();
      generateNewBoard();
    }
  }

  function closeModalViaX() {
    // La X hace lo mismo que el botón de acción del modal (Siguiente / Entendido).
    const actionBtn = document.getElementById("modal-action-btn");
    if (actionBtn && actionBtn.onclick) {
      actionBtn.onclick();
    } else {
      closeModal();
    }
  }

  function closeModalOnOverlay(event) {
    if (event.target.id === "gameover-modal") {
      closeModalViaX();
    }
  }
</script>
