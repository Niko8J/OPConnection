<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One Piece Connections</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    html { height: 100%; }
    body {
      background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center;
      min-height: 100vh; min-height: 100dvh; padding: 12px;
    }
    .container { max-width: 650px; width: 100%; text-align: center; position: relative; }
    h1 { margin-bottom: 4px; color: #f59e0b; font-size: 2rem; text-transform: uppercase; letter-spacing: 1px; }
    p { margin-bottom: 10px; color: #94a3b8; }

    .difficulty-selector { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .diff-label { color: #94a3b8; font-weight: bold; margin-right: 2px; }
    .diff-btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: 2px solid #334155;
      background: #1e293b;
      color: #94a3b8;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    @media (hover: hover) and (pointer: fine) {
      .diff-btn:hover:not(:disabled) { border-color: #f59e0b; color: #f8fafc; }
    }
    .diff-btn.active { background: #f59e0b; color: #0f172a; border-color: #f59e0b; }

    .infinite-score { font-size: 1rem; font-weight: bold; color: #f59e0b; margin-bottom: 8px; }

    .lives-container { font-size: 1.1rem; font-weight: bold; margin-bottom: 8px; color: #e2e8f0; display: flex; justify-content: center; align-items: center; gap: 12px; }
    .life-wrapper { position: relative; display: inline-flex; justify-content: center; align-items: center; }
    .life-icon { font-size: 1.5rem; user-select: none; }
    .life-wrapper.lost .life-icon { filter: opacity(0.3); }
    .life-wrapper.lost::after {
      content: "❌";
      position: absolute;
      font-size: 1.2rem;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .warning-msg { color: #ef4444; font-size: 0.9rem; font-weight: bold; min-height: 18px; margin-bottom: 6px; }

    .board { display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
    .solved-category { padding: 15px; border-radius: 8px; font-weight: bold; color: #0f172a; text-align: center; animation: fadeIn 0.3s ease; }
    .solved-items-list { display: flex; justify-content: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
    .solved-img { 
      width: 50px; 
      height: 50px; 
      object-fit: contain; 
      border-radius: 6px; 
      border: 2px solid #0f172a; 
      background-color: #1e293b;
    }
    
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    
    .card {
      background-color: #1e293b;
      border: 3px solid #334155;
      border-radius: 8px;
      height: 120px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
      overflow: hidden;
      padding: 4px;
    }
    .card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
    }
    @media (hover: hover) and (pointer: fine) {
      .card:hover { border-color: #f59e0b; }
    }
    .card.selected { border-color: #f59e0b; box-shadow: 0 0 10px #f59e0b; transform: scale(0.96); }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
      width: 100%;
      flex-wrap: wrap;
    }
    .controls-left {
      display: flex;
      gap: 10px;
    }
    #view-results-btn {
      margin-left: auto;
    }

    button.action-btn {
      padding: 10px 20px;
      border-radius: 20px;
      border: 2px solid #334155;
      background: #1e293b;
      color: #f8fafc;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    @media (hover: hover) and (pointer: fine) {
      button.action-btn:hover:not(:disabled) { background: #334155; }
      button.submit:hover:not(:disabled) { background: #d97706; border-color: #d97706; }
    }
    button.submit { background: #f59e0b; color: #0f172a; border-color: #f59e0b; }
    button:disabled { opacity: 0.3; cursor: not-allowed; }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: flex-start;
      padding: 30px 15px;
      overflow-y: auto;
      z-index: 100;
    }
    .modal-content {
      background: #1e293b;
      border: 2px solid #ef4444;
      border-radius: 12px;
      padding: 25px;
      max-width: 520px;
      width: 100%;
      margin: auto;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      animation: fadeIn 0.3s ease;
      position: relative;
    }
    .modal-content h2 { margin-bottom: 10px; font-size: 1.6rem; }
    .solutions-list { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; margin-bottom: 20px; text-align: left; }

    .close-btn {
      position: absolute;
      top: 12px; right: 15px;
      background: none; border: none;
      color: #94a3b8; font-size: 1.5rem;
      font-weight: bold; cursor: pointer;
    }
    @media (hover: hover) and (pointer: fine) {
      .close-btn:hover { color: #f8fafc; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      body { padding: 8px; }
      h1 { font-size: 1.4rem; margin-bottom: 2px; }
      p { font-size: 0.85rem; margin-bottom: 8px; }
      .difficulty-selector { gap: 6px; margin-bottom: 10px; }
      .diff-label { width: 100%; margin-bottom: 2px; }
      .diff-btn { padding: 6px 10px; font-size: 0.85rem; }
      .lives-container { margin-bottom: 6px; font-size: 1rem; gap: 8px; }
      .warning-msg { min-height: 14px; margin-bottom: 4px; font-size: 0.8rem; }
      .board { gap: 6px; margin-bottom: 8px; }
      .grid { gap: 6px; }
      .card { height: 80px; padding: 3px; border-width: 2px; }
      .controls { margin-top: 6px; gap: 8px; }
      button.action-btn { padding: 8px 14px; font-size: 0.9rem; }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>One Piece Connections</h1>
  <p>Encuentra 4 grupos conectados por distintos atributos.</p>

  <div class="difficulty-selector">
    <span class="diff-label">Dificultades:</span>
    <button class="diff-btn active" onclick="setDifficulty('facil', event)">Novato</button>
    <button class="diff-btn" onclick="setDifficulty('media', event)">Supernova</button>
    <button class="diff-btn" onclick="setDifficulty('dificil', event)">Yonko</button>
    <button class="diff-btn" onclick="setDifficulty('infinito', event)">Infinito</button>
  </div>

  <div id="infinite-score" class="infinite-score" style="display: none;"></div>

  <div class="lives-container">
    Vidas: <span id="lives-icons"></span>
  </div>

  <div id="warning-msg" class="warning-msg"></div>

  <div class="board">
    <div id="solved-container"></div>
    <div id="grid" class="grid"></div>
  </div>

  <div class="controls">
    <div class="controls-left">
      <button class="action-btn submit" id="submit-btn" onclick="checkGuess()">Enviar</button>
      <button class="action-btn" id="deselect-btn" onclick="deselectAll()">Limpiar</button>
    </div>
    <button class="action-btn" id="view-results-btn" onclick="openModal()" style="display: none;">📊 Resultados</button>
  </div>
</div>

<div id="gameover-modal" class="modal-overlay" onclick="closeModalOnOverlay(event)">
  <div class="modal-content">
    <button class="close-btn" onclick="closeModal()">&times;</button>
    <h2 id="modal-title"></h2>
    <p id="modal-text"></p>
    <div id="solutions-container" class="solutions-list"></div>
    <button class="action-btn" id="modal-action-btn" onclick="closeModal()">Entendido</button>
  </div>
</div>

<script>
  const MAX_LIVES = 4;
  const COLORS = ["#fef08a", "#bbf7d0", "#bfdbfe", "#e9d5ff"];
  
  let database = [];
  let currentDifficulty = "facil";
  let currentCategories = [];
  let cards = [];
  let selectedCards = [];
  let lives = MAX_LIVES;
  let gameOver = false;

  let isInfiniteMode = false;
  let infiniteSolvedCount = 0;
  let infiniteSavedState = null;
  let solvedOrder = [];
  let awaitingNextPanel = false;

  window.addEventListener("DOMContentLoaded", () => {
    fetch("personajes.json")
      .then(res => {
        if (!res.ok) throw new Error(`No se pudo cargar personajes.json (${res.status})`);
        return res.json();
      })
      .then(data => {
        database = data;
        generateNewBoard();
      })
      .catch(err => {
        document.getElementById("warning-msg").innerText = "⚠️ " + err.message;
      });
  });

  function setDifficulty(level, event) {
    if (isInfiniteMode && level !== "infinito") {
      // Si dejamos un panel ya resuelto sin pulsar "Siguiente", lo avanzamos en silencio
      // para no dejar un panel a medio cerrar guardado.
      if (awaitingNextPanel) {
        closeModal();
        awaitingNextPanel = false;
        generateNewBoard();
      }

      // Si dejamos una partida Infinito a medias (sin haber fallado), guardamos su progreso.
      if (!gameOver) {
        infiniteSavedState = {
          currentCategories,
          cards,
          selectedCards,
          lives,
          solvedCount: infiniteSolvedCount,
          solvedOrder,
          solvedContainerHTML: document.getElementById("solved-container").innerHTML
        };
      }
    }

    currentDifficulty = level;
    isInfiniteMode = (level === "infinito");
    document.querySelectorAll('.diff-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');

    if (isInfiniteMode) {
      if (infiniteSavedState) {
        // Reanudamos la partida Infinito justo donde se dejó.
        currentCategories = infiniteSavedState.currentCategories;
        cards = infiniteSavedState.cards;
        selectedCards = infiniteSavedState.selectedCards;
        lives = infiniteSavedState.lives;
        infiniteSolvedCount = infiniteSavedState.solvedCount;
        solvedOrder = infiniteSavedState.solvedOrder || [];
        gameOver = false;
        awaitingNextPanel = false;

        document.getElementById("solved-container").innerHTML = infiniteSavedState.solvedContainerHTML;
        document.getElementById("warning-msg").innerText = "";
        document.getElementById("submit-btn").disabled = false;
        document.getElementById("deselect-btn").disabled = false;
        document.getElementById("view-results-btn").style.display = "none";
        document.getElementById("gameover-modal").style.display = "none";

        renderLives();
        renderGrid();
        updateInfiniteScoreDisplay();
        return;
      }

      infiniteSolvedCount = 0;
    }

    updateInfiniteScoreDisplay();
    generateNewBoard();
  }

  function updateInfiniteScoreDisplay() {
    const el = document.getElementById("infinite-score");
    if (isInfiniteMode) {
      el.style.display = "block";
      el.innerText = `🔥 Paneles resueltos: ${infiniteSolvedCount}`;
    } else {
      el.style.display = "none";
    }
  }

  function parseTagEntries(tagData) {
    if (tagData === null || tagData === undefined) return [];

    const items = Array.isArray(tagData) ? tagData : [tagData];

    return items.map(item => {
      let value = item;
      let difficulty = "facil";

      if (item !== null && typeof item === "object" && !Array.isArray(item)) {
        if ("dif" in item) difficulty = item.dif;

        if ("val" in item) value = item.val;
        else if ("value" in item) value = item.value;
        else if ("nombre" in item) value = item.nombre;
        else if ("name" in item) value = item.name;
        else {
          const stringVals = Object.values(item).filter(x => typeof x === "string" || typeof x === "number");
          value = stringVals.length > 0 ? stringVals[0] : Object.values(item)[0];
        }
      }

      return { value: String(value), difficulty };
    });
  }

  function getTagValueOnly(categoryName) {
    return categoryName.includes(": ") ? categoryName.split(": ").slice(1).join(": ") : categoryName;
  }

  function generateNewBoard() {
    if (database.length === 0) return;

    let tagGroups = {}; 

    database.forEach(char => {
      if (char.tags) {
        Object.entries(char.tags).forEach(([key, tagData]) => {
          const entries = parseTagEntries(tagData);

          entries.forEach(({ value, difficulty: tagDif }) => {
            if (isInfiniteMode || tagDif === currentDifficulty) {
              const groupName = `${key}: ${value}`;
              if (!tagGroups[groupName]) tagGroups[groupName] = [];
              if (!tagGroups[groupName].some(c => c.id === char.id)) {
                tagGroups[groupName].push(char);
              }
            }
          });
        });
      }
    });

    let validGroupNames = Object.keys(tagGroups).filter(group => tagGroups[group].length >= 4);

    if (validGroupNames.length < 4) {
      document.getElementById("warning-msg").innerText = 
        `⚠️ Faltan datos en '${currentDifficulty.toUpperCase()}': Se necesitan al menos 4 categorías válidas. Hay ${validGroupNames.length}.`;
      return;
    }

    const charHasAnyTagMatch = (char, targetGroupName) => {
      const sepIndex = targetGroupName.indexOf(": ");
      const targetKey = targetGroupName.slice(0, sepIndex);
      const targetVal = targetGroupName.slice(sepIndex + 2);
      if (!char.tags) return false;

      return Object.entries(char.tags).some(([key, tagData]) => {
        if (key !== targetKey) return false;
        const entries = parseTagEntries(tagData);
        return entries.some(e => e.value === targetVal);
      });
    };

    let selectedGroups = null;
    let maxAttempts = 1000;

    for (let attempt = 0; attempt < maxAttempts; attempt++) {
      let shuffledGroups = [...validGroupNames].sort(() => Math.random() - 0.5);
      let candidateGroups = [];
      let usedCharIds = new Set();

      for (let groupName of shuffledGroups) {
        if (candidateGroups.length === 4) break;

        let exclusiveChars = tagGroups[groupName].filter(char => {
          if (usedCharIds.has(char.id)) return false;

          for (let prevGroup of candidateGroups) {
            if (charHasAnyTagMatch(char, prevGroup.name)) return false;
          }
          return true;
        });

        if (exclusiveChars.length >= 4) {
          let chosenChars = exclusiveChars.sort(() => Math.random() - 0.5).slice(0, 4);

          let invalidatesPrevious = false;
          for (let prevGroup of candidateGroups) {
            for (let prevChar of prevGroup.items) {
              if (charHasAnyTagMatch(prevChar, groupName)) {
                invalidatesPrevious = true;
                break;
              }
            }
            if (invalidatesPrevious) break;
          }

          if (!invalidatesPrevious) {
            candidateGroups.push({
              name: groupName,
              color: COLORS[candidateGroups.length],
              items: chosenChars
            });
            chosenChars.forEach(c => usedCharIds.add(c.id));
          }
        }
      }

      if (candidateGroups.length === 4) {
        selectedGroups = candidateGroups;
        break;
      }
    }

    if (!selectedGroups) {
      document.getElementById("warning-msg").innerText = 
        `⚠️ No se encontraron 4 categorías sin solapamiento en '${currentDifficulty.toUpperCase()}'. Añade más personajes al JSON o diversifica sus tags.`;
      return;
    }

    currentCategories = selectedGroups;
    initGame();
  }

  function initGame() {
    lives = MAX_LIVES;
    gameOver = false;
    awaitingNextPanel = false;
    cards = [];
    selectedCards = [];
    solvedOrder = [];

    document.getElementById("solved-container").innerHTML = "";
    document.getElementById("warning-msg").innerText = "";
    document.getElementById("submit-btn").disabled = false;
    document.getElementById("deselect-btn").disabled = false;
    document.getElementById("view-results-btn").style.display = "none";
    document.getElementById("gameover-modal").style.display = "none";

    currentCategories.forEach(cat => {
      cat.items.forEach(item => {
        cards.push({ name: item.name, img: item.img, category: cat.name });
      });
    });

    cards = cards.sort(() => Math.random() - 0.5);
    renderLives();
    renderGrid();
  }

  function renderLives() {
    const livesIcons = document.getElementById("lives-icons");
    livesIcons.innerHTML = "";

    for (let i = 0; i < MAX_LIVES; i++) {
      const wrapper = document.createElement("div");
      wrapper.className = `life-wrapper ${i >= lives ? 'lost' : ''}`;
      
      const span = document.createElement("span");
      span.className = "life-icon";
      span.innerText = "🏴‍☠️";

      wrapper.appendChild(span);
      livesIcons.appendChild(wrapper);
    }
  }

  function renderGrid() {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    cards.forEach((card, index) => {
      const cardEl = document.createElement("div");
      cardEl.className = `card ${selectedCards.includes(index) ? 'selected' : ''}`;
      
      const imgEl = document.createElement("img");
      imgEl.src = card.img;
      imgEl.alt = card.name;
      
      imgEl.onerror = function() {
        this.onerror = null;
        this.src = "https://dummyimage.com/200x200/334155/ffffff.png&text=" + encodeURIComponent(card.name);
      };

      cardEl.appendChild(imgEl);
      cardEl.onclick = () => toggleSelect(index);
      grid.appendChild(cardEl);
    });
  }

  function toggleSelect(index) {
    if (gameOver) return;
    if (selectedCards.includes(index)) {
      selectedCards = selectedCards.filter(i => i !== index);
    } else {
      selectedCards.push(index);
    }
    
    if (selectedCards.length === 4) {
      document.getElementById("warning-msg").innerText = "";
    }
    
    renderGrid();
  }

  function deselectAll() {
    if (gameOver) return;
    selectedCards = [];
    document.getElementById("warning-msg").innerText = "";
    renderGrid();
  }

  function checkGuess() {
    if (gameOver) return;
    const warningMsg = document.getElementById("warning-msg");

    if (selectedCards.length !== 4) {
      warningMsg.innerText = selectedCards.length < 4 ? "Selecciona 4 imágenes para validar." : "Solo puedes validar 4 imágenes a la vez.";
      return;
    }

    warningMsg.innerText = "";

    const selectedCategory = cards[selectedCards[0]].category;
    const isCorrect = selectedCards.every(i => cards[i].category === selectedCategory);

    if (isCorrect) {
      const catData = currentCategories.find(c => c.name === selectedCategory);
      
      const solvedContainer = document.getElementById("solved-container");
      const solvedEl = document.createElement("div");
      solvedEl.className = "solved-category";
      solvedEl.style.backgroundColor = catData.color;
      
      let imgsHtml = '<div class="solved-items-list">';
      catData.items.forEach(item => {
        imgsHtml += `<img src="${item.img}" title="${item.name}" class="solved-img" onerror="this.src='https://dummyimage.com/100x100/334155/ffffff.png&text=?'"/>`;
      });
      imgsHtml += '</div>';

      solvedEl.innerHTML = `${imgsHtml}<div>${getTagValueOnly(catData.name)}</div>`;
      solvedContainer.appendChild(solvedEl);
      solvedOrder.push(selectedCategory);

      cards = cards.filter((_, i) => !selectedCards.includes(i));
      selectedCards = [];
      renderGrid();

      if (cards.length === 0) {
        if (isInfiniteMode) {
          handlePanelComplete();
        } else {
          handleWin();
        }
      }
    } else {
      lives--;
      renderLives();

      const categoryCounts = {};
      selectedCards.forEach(i => {
        const cat = cards[i].category;
        categoryCounts[cat] = (categoryCounts[cat] || 0) + 1;
      });
      const maxMatches = Math.max(...Object.values(categoryCounts));

      if (lives === 0) {
        handleGameOver();
      } else {
        if (maxMatches === 3) {
          warningMsg.innerText = "Grupo incorrecto: 3 coincidencias.";
        } else if (maxMatches === 2) {
          warningMsg.innerText = "Grupo incorrecto: 2 coincidencias.";
        } else {
          warningMsg.innerText = "Grupo incorrecto. Inténtalo de nuevo.";
        }
      }
    }
  }

  function handlePanelComplete() {
    infiniteSolvedCount++;
    updateInfiniteScoreDisplay();
    awaitingNextPanel = true;

    document.getElementById("submit-btn").disabled = true;
    document.getElementById("deselect-btn").disabled = true;
    document.getElementById("view-results-btn").style.display = "inline-block";

    const modalContent = document.querySelector("#gameover-modal .modal-content");
    modalContent.style.borderColor = "#22c55e";

    const titleEl = document.getElementById("modal-title");
    titleEl.innerText = "🎉 ¡Panel superado!";
    titleEl.style.color = "#22c55e";

    const textEl = document.getElementById("modal-text");
    textEl.innerText = `Paneles resueltos en este Infinito: ${infiniteSolvedCount}.`;

    const actionBtn = document.getElementById("modal-action-btn");
    actionBtn.innerText = "Siguiente ➡️";
    actionBtn.onclick = continueInfinitePanel;

    renderModalSolutions();
  }

  function continueInfinitePanel() {
    awaitingNextPanel = false;
    document.getElementById("gameover-modal").style.display = "none";
    generateNewBoard();
  }

  function handleWin() {
    gameOver = true;
    awaitingNextPanel = false;
    document.getElementById("submit-btn").disabled = true;
    document.getElementById("deselect-btn").disabled = true;
    document.getElementById("view-results-btn").style.display = "inline-block";

    const modalContent = document.querySelector("#gameover-modal .modal-content");
    modalContent.style.borderColor = "#22c55e";

    const titleEl = document.getElementById("modal-title");
    titleEl.innerText = "🏆 ¡VICTORIA!";
    titleEl.style.color = "#22c55e";

    const textEl = document.getElementById("modal-text");
    textEl.innerText = "¡Has descubierto todas las conexiones correctamente!";

    const actionBtn = document.getElementById("modal-action-btn");
    actionBtn.innerText = "Entendido";
    actionBtn.onclick = closeModal;

    renderModalSolutions();
  }

  function handleGameOver() {
    gameOver = true;
    awaitingNextPanel = false;
    document.getElementById("submit-btn").disabled = true;
    document.getElementById("deselect-btn").disabled = true;
    document.getElementById("view-results-btn").style.display = "inline-block";

    const modalContent = document.querySelector("#gameover-modal .modal-content");
    modalContent.style.borderColor = "#ef4444";

    const titleEl = document.getElementById("modal-title");
    titleEl.innerText = "🏴‍☠️ ¡DERROTADO!";
    titleEl.style.color = "#ef4444";

    const textEl = document.getElementById("modal-text");
    if (isInfiniteMode) {
      infiniteSavedState = null; // La partida Infinito termina: la próxima vez se empieza de cero.
      textEl.innerText = `Has agotado tus vidas tras resolver ${infiniteSolvedCount} panel(es) en modo Infinito. Solución de este panel:`;
    } else {
      textEl.innerText = "Has agotado todas tus vidas. Solución de esta partida:";
    }

    const actionBtn = document.getElementById("modal-action-btn");
    actionBtn.innerText = "Entendido";
    actionBtn.onclick = closeModal;

    renderModalSolutions();
  }

  function renderModalSolutions() {
    const solutionsContainer = document.getElementById("solutions-container");
    solutionsContainer.innerHTML = "";

    // Mostramos primero las categorías en el orden en que se acertaron;
    // si quedó alguna sin acertar (derrota), se añade al final.
    const orderedCats = solvedOrder
      .map(name => currentCategories.find(c => c.name === name))
      .filter(Boolean);
    currentCategories.forEach(cat => {
      if (!orderedCats.includes(cat)) orderedCats.push(cat);
    });

    orderedCats.forEach(cat => {
      const solEl = document.createElement("div");
      solEl.className = "solved-category";
      solEl.style.backgroundColor = cat.color;
      
      let imgsHtml = '<div class="solved-items-list">';
      cat.items.forEach(item => {
        imgsHtml += `<img src="${item.img}" title="${item.name}" class="solved-img" onerror="this.src='https://dummyimage.com/100x100/334155/ffffff.png&text=?'"/>`;
      });
      imgsHtml += '</div>';

      solEl.innerHTML = `${imgsHtml}<div>${getTagValueOnly(cat.name)}</div>`;
      solutionsContainer.appendChild(solEl);
    });

    openModal();
  }

  function openModal() {
    if (gameOver || awaitingNextPanel) {
      document.getElementById("gameover-modal").style.display = "flex";
    }
  }

  function closeModal() {
    document.getElementById("gameover-modal").style.display = "none";
  }

  function closeModalOnOverlay(event) {
    if (event.target.id === "gameover-modal") {
      closeModal();
    }
  }
</script>
</body>
</html>
