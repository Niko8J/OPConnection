<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Piece Murdoku</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card-border: #334155;
    --amber: #f59e0b;
    --text: #f8fafc;
    --text-dim: #94a3b8;
    --green: #22c55e;
    --red: #ef4444;
    --box-border: #64748b;
    --room-cubierta: rgba(56, 189, 248, 0.16);
    --room-camarotes: rgba(168, 85, 247, 0.16);
    --room-cocina: rgba(251, 146, 60, 0.16);
    --room-bodega: rgba(163, 230, 53, 0.16);
    --room-timon: rgba(239, 68, 68, 0.16);
    --room-vigia: rgba(148, 163, 184, 0.2);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 12px;
    min-height: 100vh;
  }

  h1 { font-size: 1.4rem; margin: 4px 0 2px; text-align: center; }
  .subtitle {
    color: var(--text-dim); font-size: 0.82rem; margin: 0 0 16px;
    text-align: center; max-width: 460px;
  }

  .board-wrap { width: min(94vw, 460px); }
  .board {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-template-rows: repeat(7, 1fr);
    width: 100%;
    aspect-ratio: 1;
    background: var(--box-border);
    gap: 1px;
    border: 3px solid var(--box-border);
    border-radius: 8px;
    overflow: hidden;
  }
  .cell {
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .cell.room-Cubierta { background: var(--room-cubierta); }
  .cell.room-Camarotes { background: var(--room-camarotes); }
  .cell.room-Cocina { background: var(--room-cocina); }
  .cell.room-Bodega { background: var(--room-bodega); }
  .cell.room-Timon { background: var(--room-timon); }
  .cell.room-Vigia { background: var(--room-vigia); }

  .cell.blocked .furniture-icon { font-size: 2em; opacity: 1; }
  .furniture-icon.decorative {
    position: absolute; bottom: 1px; left: 2px;
    font-size: 1.7em; opacity: 1; z-index: 3; pointer-events: none;
    text-shadow: 0 0 3px #000, 0 0 3px #000;
  }
  .room-watermark {
    position: absolute; top: 1px; left: 2px; font-size: 0.75em; opacity: 0.5; pointer-events: none;
  }
  .cell.occupied img {
    width: 100%; height: 100%; object-fit: cover; object-position: top center;
    transform: scale(1.3); transform-origin: top center;
  }
  .fallback-text {
    font-size: 0.5rem; font-weight: bold; text-align: center; color: var(--text-dim);
    padding: 1px; line-height: 1.1; word-break: break-word;
  }

  .legend {
    width: min(94vw, 460px);
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 6px 10px; margin-top: 10px; font-size: 0.72rem; color: var(--text-dim);
  }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-item .emoji { font-size: 1.1em; }

  .placement-wrap { width: min(94vw, 460px); margin-top: 20px; }
  .placement-title { font-weight: bold; font-size: 0.95rem; margin-bottom: 10px; }
  .placement-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--card-border); border-radius: 10px;
    padding: 8px 10px; margin-bottom: 8px;
  }
  .placement-row.victim { border-color: var(--red); border-width: 2px; }
  .placement-portrait {
    width: 44px; height: 44px; border-radius: 8px; overflow: hidden; flex-shrink: 0;
    background: var(--bg); display: flex; align-items: center; justify-content: center;
  }
  .placement-portrait img {
    width: 100%; height: 100%; object-fit: cover; object-position: top center;
    transform: scale(1.3); transform-origin: top center;
  }
  .placement-name { flex: 0 0 84px; font-size: 0.85rem; font-weight: bold; }
  .placement-name .skull { color: var(--red); margin-left: 4px; }
  .placement-select {
    flex: 1 1 auto; background: var(--bg); color: var(--text); border: 1px solid var(--card-border);
    border-radius: 8px; padding: 10px 8px; font-size: 0.95rem; font-family: inherit;
  }

  .clues-wrap { width: min(94vw, 460px); margin-top: 18px; }
  .clues-title { font-weight: bold; font-size: 0.95rem; margin-bottom: 8px; }
  .clues-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .clues-list li {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 8px;
    padding: 8px 12px; font-size: 0.82rem;
  }

  .status {
    margin-top: 16px; font-size: 0.85rem; color: var(--text-dim); text-align: center;
    min-height: 1.2em; max-width: 460px;
  }
  .status.win { color: var(--green); font-weight: bold; }
  .status.wrong { color: var(--red); font-weight: bold; }

  .controls { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; justify-content: center; }
  .btn {
    background: var(--amber); color: #1c1305; border: none; border-radius: 10px;
    padding: 10px 18px; font-weight: bold; font-size: 0.9rem; cursor: pointer;
  }
  .btn.secondary { background: transparent; color: var(--text-dim); border: 1px solid var(--card-border); }

  .suspect-picker {
    display: none; width: min(96vw, 460px); margin-top: 16px;
    grid-template-columns: repeat(3, 1fr); gap: 8px;
  }
  .suspect-picker.show { display: grid; }
  .suspect-btn {
    background: var(--card); border: 2px solid var(--card-border); border-radius: 10px;
    padding: 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .suspect-btn img { width: 48px; height: 48px; object-fit: cover; object-position: top center; border-radius: 6px; }
  .suspect-btn span { font-size: 0.72rem; color: var(--text); }
  .suspect-btn:hover { border-color: var(--amber); }
</style>
</head>
<body>

<h1>🔪 One Piece Murdoku</h1>
<p class="subtitle">Buggy ha aparecido muerto en el barco. Elige, con los desplegables de abajo, en qué columna estaba cada sospechoso — usa las pistas para deducirlo — y descubre quién se quedó a solas con él.</p>

<div class="board-wrap">
  <div class="board" id="board"></div>
</div>

<div class="legend" id="legend"></div>

<div class="placement-wrap">
  <p class="placement-title">👥 Coloca a cada sospechoso</p>
  <div id="placement-rows"></div>
</div>

<div class="clues-wrap">
  <p class="clues-title">🔎 Pistas</p>
  <ul class="clues-list" id="clues-list"></ul>
</div>

<p class="status" id="status"></p>

<div class="suspect-picker" id="suspect-picker"></div>

<div class="controls">
  <button class="btn secondary" onclick="resetBoard()">Reiniciar tablero</button>
</div>

<script>
  const ROOM_DEFS = {
    "Cubierta":  { rows: [0, 1], cols: [0, 6] },
    "Camarotes": { rows: [2, 3], cols: [0, 3] },
    "Cocina":    { rows: [2, 3], cols: [4, 6] },
    "Bodega":    { rows: [4, 5], cols: [0, 3] },
    "Timon":     { rows: [4, 5], cols: [4, 6] },
    "Vigia":     { rows: [6, 6], cols: [0, 6] }
  };
  const ROOM_EMOJI = {
    Cubierta: "🚢", Camarotes: "🚪", Cocina: "🍳", Bodega: "📦", Timon: "⚓", Vigia: "🔭"
  };
  const ROOM_LABELS = {
    Cubierta: "Cubierta", Camarotes: "Camarotes", Cocina: "Cocina",
    Bodega: "Bodega", Timon: "Timón", Vigia: "Vigía"
  };

  function roomOf(r, c) {
    for (const [name, def] of Object.entries(ROOM_DEFS)) {
      if (r >= def.rows[0] && r <= def.rows[1] && c >= def.cols[0] && c <= def.cols[1]) return name;
    }
    return null;
  }

  const BLOCKING_FURNITURE = {
    "0,3": "🪵 Mástil", "1,0": "💣 Cañón",
    "2,5": "🛢️ Barril", "5,2": "🪙 Cofre", "4,5": "🧭 Timón", "6,3": "🔭 Catalejo"
  };
  const DECORATIVE_FURNITURE = {
    "5,0": "🪑 Silla"
  };

  const PEOPLE = [
    { id: "mohji",   name: "Mohji",   img: "imagenes/Mohji.webp",   row: 0 },
    { id: "cabaji",  name: "Cabaji",  img: "imagenes/Cabaji.webp",  row: 1 },
    { id: "alvida",  name: "Alvida",  img: "imagenes/Alvida.webp",  row: 2 },
    { id: "tashigi", name: "Tashigi", img: "imagenes/Tashigi.webp", row: 3 },
    { id: "buggy",   name: "Buggy",   img: "imagenes/Buggy.webp",   row: 4, victim: true },
    { id: "smoker",  name: "Smoker",  img: "imagenes/Smoker.webp",  row: 5 },
    { id: "bellamy", name: "Bellamy", img: "imagenes/Bellamy.webp", row: 6 }
  ];
  const personById = Object.fromEntries(PEOPLE.map(p => [p.id, p]));

  const SOLUTION_COL = { mohji: 1, cabaji: 5, alvida: 2, tashigi: 3, buggy: 4, smoker: 6, bellamy: 0 };
  const MURDERER_ID = (() => {
    const victim = PEOPLE.find(p => p.victim);
    const victimRoom = roomOf(victim.row, SOLUTION_COL[victim.id]);
    const sharer = PEOPLE.find(p => !p.victim && roomOf(p.row, SOLUTION_COL[p.id]) === victimRoom);
    return sharer.id;
  })();

  const CLUES = [
    { text: "Bellamy estaba justo al lado de: 🪑 Silla.",
      check: pos => isAdjacentToFurniture(pos.bellamy, "5,0") },
    { text: "Mohji y Bellamy estaban en columnas contiguas (un número de columna justo al lado del otro).",
      check: pos => pos.mohji != null && pos.bellamy != null && Math.abs(pos.mohji - pos.bellamy) === 1 },
    { text: "Cabaji estaba justo al lado de: 🛢️ Barril.",
      check: pos => isAdjacentToFurniture(pos.cabaji, "2,5") },
    { text: "Alvida y Mohji estaban en columnas contiguas (un número de columna justo al lado del otro).",
      check: pos => pos.alvida != null && pos.mohji != null && Math.abs(pos.alvida - pos.mohji) === 1 },
    { text: "Tashigi estaba en: Camarotes.",
      check: pos => pos.tashigi != null && roomOf(personById.tashigi.row, pos.tashigi) === "Camarotes" },
    { text: "Cabaji estaba más a la izquierda que Smoker.",
      check: pos => pos.cabaji != null && pos.smoker != null && pos.cabaji < pos.smoker }
  ];

  function isAdjacentToFurniture(col, furnitureKey) {
    if (col == null) return false;
    const [fr, fc] = furnitureKey.split(",").map(Number);
    for (const pid in placed) {
      if (placed[pid] === col) {
        const row = personById[pid].row;
        return (Math.abs(row - fr) === 1 && col === fc) || (row === fr && Math.abs(col - fc) === 1);
      }
    }
    return false;
  }

  let placed = {};

  function usedColumns() {
    return new Set(Object.entries(placed).filter(([, v]) => v != null).map(([, v]) => v));
  }

  function isBlockedCell(r, c) {
    return (r + "," + c) in BLOCKING_FURNITURE;
  }

  function handleColumnChange(pid, value) {
    if (value === "") {
      delete placed[pid];
    } else {
      placed[pid] = parseInt(value, 10);
    }
    render();
    checkComplete();
  }

  function resetBoard() {
    placed = {};
    document.getElementById("suspect-picker").classList.remove("show");
    document.getElementById("status").textContent = "";
    document.getElementById("status").className = "status";
    render();
  }

  function checkComplete() {
    if (Object.keys(placed).length < PEOPLE.length) return;
    if (Object.values(placed).some(v => v == null)) return;
    const allCluesOk = CLUES.every(cl => cl.check(placed));
    const statusEl = document.getElementById("status");
    if (allCluesOk) {
      statusEl.textContent = "✅ Todo el mundo está donde debe estar. Ahora, ¿quién se quedó a solas con Buggy? Elige a la persona sospechosa de abajo.";
      statusEl.className = "status win";
      showSuspectPicker();
    } else {
      statusEl.textContent = "Esta colocación no cumple alguna pista todavía — revisa las pistas de abajo.";
      statusEl.className = "status wrong";
    }
  }

  function showSuspectPicker() {
    const pickerEl = document.getElementById("suspect-picker");
    pickerEl.innerHTML = "";
    PEOPLE.filter(p => !p.victim).forEach(p => {
      const btn = document.createElement("button");
      btn.className = "suspect-btn";
      btn.innerHTML = `<img src="${p.img}" alt="${p.name}"
                            onerror="this.replaceWith(Object.assign(document.createElement('div'), {className:'fallback-text', textContent:'${p.name}'}))">
                        <span>${p.name}</span>`;
      btn.onclick = () => guessMurderer(p.id);
      pickerEl.appendChild(btn);
    });
    pickerEl.classList.add("show");
  }

  function guessMurderer(pid) {
    const statusEl = document.getElementById("status");
    if (pid === MURDERER_ID) {
      statusEl.textContent = `🎉 ¡Correcto! ${personById[pid].name} estaba a solas con Buggy en la misma sala. ¡Caso resuelto!`;
      statusEl.className = "status win";
    } else {
      statusEl.textContent = `❌ ${personById[pid].name} no estaba a solas con Buggy. Vuelve a mirar en qué sala terminó cada uno.`;
      statusEl.className = "status wrong";
    }
  }

  function render() {
    renderBoard();
    renderPlacementRows();
    renderClues();
  }

  function renderBoard() {
    const el = document.getElementById("board");
    el.innerHTML = "";
    for (let r = 0; r < 7; r++) {
      for (let c = 0; c < 7; c++) {
        const cell = document.createElement("div");
        const room = roomOf(r, c);
        cell.className = "cell room-" + room;

        const furnKey = r + "," + c;
        const decorativeIcon = DECORATIVE_FURNITURE[furnKey]
          ? `<span class="furniture-icon decorative">${DECORATIVE_FURNITURE[furnKey].split(" ")[0]}</span>` : "";
        const def = ROOM_DEFS[room];
        const isFirstCellOfRoom = r === def.rows[0] && c === def.cols[0];
        const watermark = isFirstCellOfRoom ? `<span class="room-watermark">${ROOM_EMOJI[room]}</span>` : "";

        if (BLOCKING_FURNITURE[furnKey]) {
          cell.classList.add("blocked");
          cell.innerHTML = `<span class="furniture-icon">${BLOCKING_FURNITURE[furnKey].split(" ")[0]}</span>`;
        } else {
          const personHere = PEOPLE.find(p => p.row === r && placed[p.id] === c);
          if (personHere) {
            cell.classList.add("occupied");
            cell.innerHTML = `<img src="${personHere.img}" alt="${personHere.name}" title="${personHere.name}"
                                    onerror="this.replaceWith(Object.assign(document.createElement('div'), {className:'fallback-text', textContent:'${personHere.name}'}))">` + decorativeIcon + watermark;
          } else {
            cell.innerHTML = decorativeIcon + watermark;
          }
        }
        el.appendChild(cell);
      }
    }
  }

  function renderPlacementRows() {
    const el = document.getElementById("placement-rows");
    el.innerHTML = "";
    const used = usedColumns();
    PEOPLE.forEach(p => {
      const row = document.createElement("div");
      row.className = "placement-row" + (p.victim ? " victim" : "");

      const portrait = document.createElement("div");
      portrait.className = "placement-portrait";
      portrait.innerHTML = `<img src="${p.img}" alt="${p.name}"
                                  onerror="this.replaceWith(Object.assign(document.createElement('div'), {className:'fallback-text', textContent:'${p.name}'}))">`;

      const name = document.createElement("div");
      name.className = "placement-name";
      name.innerHTML = p.name + (p.victim ? ' <span class="skull">☠</span>' : "");

      const select = document.createElement("select");
      select.className = "placement-select";
      const blank = document.createElement("option");
      blank.value = "";
      blank.textContent = "— Elige columna —";
      select.appendChild(blank);
      for (let c = 0; c < 7; c++) {
        if (isBlockedCell(p.row, c)) continue;
        const opt = document.createElement("option");
        opt.value = c;
        opt.textContent = "Columna " + (c + 1);
        if (used.has(c) && placed[p.id] !== c) opt.disabled = true;
        if (placed[p.id] === c) opt.selected = true;
        select.appendChild(opt);
      }
      select.onchange = () => handleColumnChange(p.id, select.value);

      row.appendChild(portrait);
      row.appendChild(name);
      row.appendChild(select);
      el.appendChild(row);
    });
  }

  function renderClues() {
    const el = document.getElementById("clues-list");
    el.innerHTML = "";
    CLUES.forEach(cl => {
      const li = document.createElement("li");
      li.textContent = cl.text;
      el.appendChild(li);
    });
  }

  function buildLegend() {
    const el = document.getElementById("legend");
    el.innerHTML = "";
    Object.entries(ROOM_LABELS).forEach(([key, label]) => {
      const item = document.createElement("div");
      item.className = "legend-item";
      item.innerHTML = `<span class="emoji">${ROOM_EMOJI[key]}</span><span>${label}</span>`;
      el.appendChild(item);
    });
  }

  buildLegend();
  render();
</script>
</body>
</html>
