<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>One Piece Murdoku</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card-border: #334155;
    --amber: #f59e0b;
    --text: #f8fafc;
    --text-dim: #94a3b8;
    --green: #22c55e;
    --red: #ef4444;
    --box-border: #64748b;
    --room-cubierta: rgba(56, 189, 248, 0.16);
    --room-camarotes: rgba(168, 85, 247, 0.16);
    --room-cocina: rgba(251, 146, 60, 0.16);
    --room-bodega: rgba(163, 230, 53, 0.16);
    --room-timon: rgba(239, 68, 68, 0.16);
    --room-vigia: rgba(148, 163, 184, 0.2);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 12px;
    min-height: 100vh;
  }

  h1 { font-size: 1.4rem; margin: 4px 0 2px; text-align: center; }
  .subtitle {
    color: var(--text-dim); font-size: 0.82rem; margin: 0 0 16px;
    text-align: center; max-width: 460px;
  }

  /* --- Fila de personas (etiqueta fija) + tablero --- */
  .game-wrap {
    display: flex;
    width: min(96vw, 620px);
    gap: 4px;
  }
  .row-labels {
    display: flex;
    flex-direction: column;
    gap: 1px;
    flex: 0 0 13%;
  }
  .row-label {
    width: 100%;
    aspect-ratio: 1;
    background: var(--card);
    border: 2px solid var(--card-border);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    cursor: pointer;
    padding: 0;
    font: inherit;
    -webkit-appearance: none;
    appearance: none;
    touch-action: manipulation;
  }
  .row-label:disabled { cursor: default; }
  .row-label img {
    width: 100%; height: 100%; object-fit: cover; object-position: top center;
    transform: scale(1.3); transform-origin: top center;
  }
  .row-label.victim { border-color: var(--red); border-width: 3px; }
  .row-label.victim::after {
    content: "☠"; position: absolute; bottom: 0; right: 1px;
    font-size: 0.7em; color: var(--red);
  }

  .board {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-template-rows: repeat(7, 1fr);
    aspect-ratio: 1;
    background: var(--box-border);
    gap: 1px;
    border: 3px solid var(--box-border);
    border-radius: 8px;
    overflow: hidden;
  }
  .cell {
    display: flex; align-items: center; justify-content: center;
    position: relative; cursor: pointer; overflow: hidden;
    font-size: 0.65em;
    padding: 0;
    border: none;
    font: inherit;
    -webkit-appearance: none;
    appearance: none;
    touch-action: manipulation;
  }
  .cell:disabled { cursor: default; }
  .cell.room-Cubierta { background: var(--room-cubierta); }
  .cell.room-Camarotes { background: var(--room-camarotes); }
  .cell.room-Cocina { background: var(--room-cocina); }
  .cell.room-Bodega { background: var(--room-bodega); }
  .cell.room-Timon { background: var(--room-timon); }
  .cell.room-Vigia { background: var(--room-vigia); }

  .cell.blocked { cursor: not-allowed; }
  .cell.blocked .furniture-icon {
    font-size: 1.3em; opacity: 0.55;
  }
  .cell.taken-col { cursor: not-allowed; opacity: 0.35; }
  .cell.occupied { cursor: pointer; }
  .cell.occupied img {
    width: 100%; height: 100%; object-fit: cover; object-position: top center;
    transform: scale(1.3); transform-origin: top center;
  }
  .cell.hover-valid:hover { outline: 2px solid var(--amber); outline-offset: -2px; }
  .cell.selected-row { box-shadow: inset 0 0 0 2px var(--amber); }

  .fallback-text {
    font-size: 0.5rem; font-weight: bold; text-align: center; color: var(--text-dim);
    padding: 1px; line-height: 1.1; word-break: break-word;
  }

  /* --- Leyenda de salas --- */
  .legend {
    width: min(96vw, 620px);
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 5px 10px; margin-top: 10px; font-size: 0.68rem; color: var(--text-dim);
  }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-swatch { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; }

  /* --- Pistas --- */
  .clues-wrap { width: min(96vw, 620px); margin-top: 18px; }
  .clues-title { font-weight: bold; font-size: 0.95rem; margin-bottom: 8px; }
  .clues-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .clues-list li {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 8px;
    padding: 8px 12px; font-size: 0.82rem;
  }

  /* --- Estado / controles --- */
  .status {
    margin-top: 16px; font-size: 0.85rem; color: var(--text-dim); text-align: center;
    min-height: 1.2em; max-width: 460px;
  }
  .status.win { color: var(--green); font-weight: bold; }
  .status.wrong { color: var(--red); font-weight: bold; }

  .controls { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; justify-content: center; }
  .btn {
    background: var(--amber); color: #1c1305; border: none; border-radius: 10px;
    padding: 10px 18px; font-weight: bold; font-size: 0.9rem; cursor: pointer;
  }
  .btn.secondary { background: transparent; color: var(--text-dim); border: 1px solid var(--card-border); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* --- Selector del asesino (paso final) --- */
  .suspect-picker {
    display: none; width: min(96vw, 460px); margin-top: 16px;
    grid-template-columns: repeat(3, 1fr); gap: 8px;
  }
  .suspect-picker.show { display: grid; }
  .suspect-btn {
    background: var(--card); border: 2px solid var(--card-border); border-radius: 10px;
    padding: 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .suspect-btn img { width: 48px; height: 48px; object-fit: cover; object-position: top center; border-radius: 6px; }
  .suspect-btn span { font-size: 0.72rem; color: var(--text); }
  .suspect-btn:hover { border-color: var(--amber); }
</style>
</head>
<body>

<h1>🔪 One Piece Murdoku</h1>
<p class="subtitle" id="subtitle">Buggy ha aparecido muerto en el barco. Coloca a cada sospechoso en su columna correcta (una fila fija por persona) usando las pistas de abajo, y descubre quién estaba a solas con él.</p>

<div class="game-wrap">
  <div class="row-labels" id="row-labels"></div>
  <div class="board" id="board"></div>
</div>

<div class="legend" id="legend"></div>

<div class="clues-wrap">
  <p class="clues-title">🔎 Pistas</p>
  <ul class="clues-list" id="clues-list"></ul>
</div>

<p class="status" id="status"></p>

<div class="suspect-picker" id="suspect-picker"></div>

<div class="controls">
  <button class="btn secondary" onclick="resetBoard()">Reiniciar tablero</button>
</div>

<script>
  // --- Diseño del barco: 7x7, 6 salas ---
  // Cada persona tiene una FILA FIJA de partida (se ve siempre a la izquierda) — el juego
  // consiste en deducir, con las pistas, en qué COLUMNA de esa fila estaba cada una. Al ser 7
  // personas para 7 columnas, cada una ocupa una columna distinta (como en un sudoku clásico).
  const ROOM_DEFS = {
    "Cubierta":  { rows: [0, 1], cols: [0, 6] },
    "Camarotes": { rows: [2, 3], cols: [0, 3] },
    "Cocina":    { rows: [2, 3], cols: [4, 6] },
    "Bodega":    { rows: [4, 5], cols: [0, 3] },
    "Timon":     { rows: [4, 5], cols: [4, 6] },
    "Vigia":     { rows: [6, 6], cols: [0, 6] }
  };
  const ROOM_LABELS = {
    Cubierta: "Cubierta", Camarotes: "Camarotes", Cocina: "Cocina",
    Bodega: "Bodega", Timon: "Timón", Vigia: "Vigía"
  };

  function roomOf(r, c) {
    for (const [name, def] of Object.entries(ROOM_DEFS)) {
      if (r >= def.rows[0] && r <= def.rows[1] && c >= def.cols[0] && c <= def.cols[1]) return name;
    }
    return null;
  }

  // Muebles: casillas bloqueadas, nadie se puede colocar ahí.
  const FURNITURE = {
    "0,3": "🪵 Mástil", "1,0": "💣 Cañón", "3,1": "🛏️ Cama",
    "2,5": "🛢️ Barril", "5,2": "🪙 Cofre", "4,5": "🧭 Timón", "6,3": "🔭 Catalejo"
  };

  // Las 7 personas, cada una con su fila fija — Buggy es la víctima (fila 4).
  const PEOPLE = [
    { id: "mohji",   name: "Mohji",   img: "imagenes/Mohji.webp",   row: 0 },
    { id: "cabaji",  name: "Cabaji",  img: "imagenes/Cabaji.webp",  row: 1 },
    { id: "alvida",  name: "Alvida",  img: "imagenes/Alvida.webp",  row: 2 },
    { id: "tashigi", name: "Tashigi", img: "imagenes/Tashigi.webp", row: 3 },
    { id: "buggy",   name: "Buggy",   img: "imagenes/Buggy.webp",   row: 4, victim: true },
    { id: "smoker",  name: "Smoker",  img: "imagenes/Smoker.webp",  row: 5 },
    { id: "bellamy", name: "Bellamy", img: "imagenes/Bellamy.webp", row: 6 }
  ];
  const personById = Object.fromEntries(PEOPLE.map(p => [p.id, p]));

  // Solución real fijada de antemano y comprobada por ordenador: con las 5 pistas de abajo,
  // de las 1.768 formas válidas de colocar a las 7 personas sin pisar muebles (una por fila y
  // columna), esta es la ÚNICA que las cumple todas a la vez. El asesino sale solo, no hace
  // falta guardarlo a mano: es quien comparta sala con la víctima en esta misma solución.
  const SOLUTION_COL = { mohji: 1, cabaji: 5, alvida: 2, tashigi: 3, buggy: 4, smoker: 6, bellamy: 0 };
  const MURDERER_ID = (() => {
    const victim = PEOPLE.find(p => p.victim);
    const victimRoom = roomOf(victim.row, SOLUTION_COL[victim.id]);
    const sharer = PEOPLE.find(p => !p.victim && roomOf(p.row, SOLUTION_COL[p.id]) === victimRoom);
    return sharer.id;
  })();

  // Las 5 pistas, comprobadas por ordenador para que, juntas, dejen SOLO esta solución posible
  // entre las 1.768 formas válidas de colocar a todos sin pisar ningún mueble.
  const CLUES = [
    { text: "Cabaji estaba justo al lado de: 🛢️ Barril.",
      check: pos => isAdjacentToFurniture(pos.cabaji, "2,5") },
    { text: "Cabaji estaba más a la izquierda que Smoker.",
      check: pos => pos.cabaji != null && pos.smoker != null && pos.cabaji < pos.smoker },
    { text: "Buggy estaba en: Timón.",
      check: pos => pos.buggy != null && roomOf(personById.buggy.row, pos.buggy) === "Timon" },
    { text: "Alvida y Tashigi estaban en columnas contiguas (un número de columna justo al lado del otro).",
      check: pos => pos.alvida != null && pos.tashigi != null && Math.abs(pos.alvida - pos.tashigi) === 1 },
    { text: "Alvida y Mohji estaban en columnas contiguas (un número de columna justo al lado del otro).",
      check: pos => pos.alvida != null && pos.mohji != null && Math.abs(pos.alvida - pos.mohji) === 1 }
  ];

  function isAdjacentToFurniture(col, furnitureKey) {
    if (col == null) return false;
    const [fr, fc] = furnitureKey.split(",").map(Number);
    // Buscamos qué persona tiene esa columna y comprobamos si su fila es vecina de la del mueble.
    for (const pid in placed) {
      if (placed[pid] === col) {
        const row = personById[pid].row;
        return (Math.abs(row - fr) === 1 && col === fc) || (row === fr && Math.abs(col - fc) === 1);
      }
    }
    return false;
  }

  // --- Estado ---
  let placed = {};       // personId -> columna (o undefined si no colocado aún)
  let selectedPersonId = PEOPLE[0].id;
  let murdererGuessed = false;

  function usedColumns() {
    return new Set(Object.values(placed));
  }

  function isFurniture(r, c) {
    return (r + "," + c) in FURNITURE;
  }

  // --- Interacción ---

  function selectPerson(pid) {
    if (placed[pid] != null) return; // ya colocada, no hace falta re-seleccionar
    selectedPersonId = pid;
    render();
  }

  function placeAt(col) {
    if (!selectedPersonId) return;
    const person = personById[selectedPersonId];
    if (isFurniture(person.row, col)) return;
    if (usedColumns().has(col)) return;
    placed[selectedPersonId] = col;

    // pasar automáticamente a la siguiente persona sin colocar, si queda alguna
    const next = PEOPLE.find(p => placed[p.id] == null);
    selectedPersonId = next ? next.id : null;
    render();
    checkComplete();
  }

  function clearPerson(pid) {
    delete placed[pid];
    selectedPersonId = pid;
    render();
    document.getElementById("suspect-picker").classList.remove("show");
    murdererGuessed = false;
  }

  function resetBoard() {
    placed = {};
    selectedPersonId = PEOPLE[0].id;
    murdererGuessed = false;
    document.getElementById("suspect-picker").classList.remove("show");
    document.getElementById("status").textContent = "";
    document.getElementById("status").className = "status";
    render();
  }

  // --- Comprobación ---

  function checkComplete() {
    if (Object.keys(placed).length < PEOPLE.length) return;
    const allCluesOk = CLUES.every(cl => cl.check(placed));
    const statusEl = document.getElementById("status");
    if (allCluesOk) {
      statusEl.textContent = "✅ Todo el mundo está donde debe estar. Ahora, ¿quién se quedó a solas con Buggy? Elige a la persona sospechosa de abajo.";
      statusEl.className = "status win";
      showSuspectPicker();
    } else {
      statusEl.textContent = "Esta colocación no cumple alguna pista todavía — revisa las pistas de abajo.";
      statusEl.className = "status wrong";
    }
  }

  function showSuspectPicker() {
    const pickerEl = document.getElementById("suspect-picker");
    pickerEl.innerHTML = "";
    PEOPLE.filter(p => !p.victim).forEach(p => {
      const btn = document.createElement("button");
      btn.className = "suspect-btn";
      btn.innerHTML = `<img src="${p.img}" alt="${p.name}"
                            onerror="this.replaceWith(Object.assign(document.createElement('div'), {className:'fallback-text', textContent:'${p.name}'}))">
                        <span>${p.name}</span>`;
      btn.onclick = () => guessMurderer(p.id);
      pickerEl.appendChild(btn);
    });
    pickerEl.classList.add("show");
  }

  function guessMurderer(pid) {
    const statusEl = document.getElementById("status");
    if (pid === MURDERER_ID) {
      statusEl.textContent = `🎉 ¡Correcto! ${personById[pid].name} estaba a solas con Buggy en la misma sala. ¡Caso resuelto!`;
      statusEl.className = "status win";
      murdererGuessed = true;
    } else {
      statusEl.textContent = `❌ ${personById[pid].name} no estaba a solas con Buggy. Vuelve a mirar en qué sala terminó cada uno.`;
      statusEl.className = "status wrong";
    }
  }

  // --- Pintado ---

  function render() {
    renderRowLabels();
    renderBoard();
    renderClues();
  }

  function renderRowLabels() {
    const el = document.getElementById("row-labels");
    el.innerHTML = "";
    PEOPLE.forEach(p => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "row-label" + (p.victim ? " victim" : "") + (selectedPersonId === p.id ? " selected-row" : "");
      btn.innerHTML = `<img src="${p.img}" alt="${p.name}" title="${p.name}"
                            onerror="this.replaceWith(Object.assign(document.createElement('div'), {className:'fallback-text', textContent:'${p.name}'}))">`;
      btn.onclick = () => selectPerson(p.id);
      el.appendChild(btn);
    });
  }

  function renderBoard() {
    const el = document.getElementById("board");
    el.innerHTML = "";
    const used = usedColumns();
    for (let r = 0; r < 7; r++) {
      for (let c = 0; c < 7; c++) {
        const cell = document.createElement("button");
        cell.type = "button";
        const room = roomOf(r, c);
        cell.className = "cell room-" + room;
        cell.disabled = true; // se habilita más abajo solo si de verdad se puede pulsar

        const furnKey = r + "," + c;
        if (FURNITURE[furnKey]) {
          cell.classList.add("blocked");
          cell.innerHTML = `<span class="furniture-icon">${FURNITURE[furnKey].split(" ")[0]}</span>`;
        } else {
          // ¿hay alguien ya colocado aquí?
          const personHere = PEOPLE.find(p => p.row === r && placed[p.id] === c);
          if (personHere) {
            cell.classList.add("occupied");
            cell.innerHTML = `<img src="${personHere.img}" alt="${personHere.name}" title="${personHere.name}"
                                    onerror="this.replaceWith(Object.assign(document.createElement('div'), {className:'fallback-text', textContent:'${personHere.name}'}))">`;
            cell.onclick = () => clearPerson(personHere.id);
            cell.disabled = false;
          } else if (r === personById[selectedPersonId]?.row) {
            if (used.has(c)) {
              cell.classList.add("taken-col");
            } else {
              cell.classList.add("hover-valid");
              cell.onclick = () => placeAt(c);
              cell.disabled = false;
            }
          } else if (used.has(c)) {
            cell.classList.add("taken-col");
          }
        }
        el.appendChild(cell);
      }
    }
  }

  function renderClues() {
    const el = document.getElementById("clues-list");
    el.innerHTML = "";
    CLUES.forEach(cl => {
      const li = document.createElement("li");
      li.textContent = cl.text;
      el.appendChild(li);
    });
  }

  function buildLegend() {
    const el = document.getElementById("legend");
    el.innerHTML = "";
    Object.entries(ROOM_LABELS).forEach(([key, label]) => {
      const item = document.createElement("div");
      item.className = "legend-item";
      item.innerHTML = `<span class="legend-swatch" style="background:var(--room-${key.toLowerCase()})"></span><span>${label}</span>`;
      el.appendChild(item);
    });
  }

  buildLegend();
  render();
</script>
</body>
</html>
